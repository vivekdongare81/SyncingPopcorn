# server:
#   port: 8080  # Change 8080 to your desired port
#
# You can edit/add any Spring Boot config here at any time.

app:
  websocket:
    allowed-origin: http://localhost:3000
    
spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:WMT_db
    driverClassName: org.h2.Driver
    username: root
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect 